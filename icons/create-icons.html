<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Extension Icons</title>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Right-click each canvas below and "Save image as..." with the appropriate name:</p>

  <div>
    <h3>icon16.png</h3>
    <canvas id="icon16" width="16" height="16"></canvas>
  </div>

  <div>
    <h3>icon48.png</h3>
    <canvas id="icon48" width="48" height="48"></canvas>
  </div>

  <div>
    <h3>icon128.png</h3>
    <canvas id="icon128" width="128" height="128"></canvas>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(0, 0, size, size);

      // Draw a simple notepad icon
      const padding = size * 0.2;
      const noteWidth = size - (padding * 2);
      const noteHeight = size - (padding * 2);

      // White note
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(padding, padding, noteWidth, noteHeight);

      // Lines on note
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = Math.max(1, size / 32);

      const lineCount = 3;
      const lineSpacing = noteHeight / (lineCount + 1);

      for (let i = 1; i <= lineCount; i++) {
        const y = padding + (lineSpacing * i);
        const lineWidth = noteWidth * 0.7;
        const startX = padding + (noteWidth * 0.15);

        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(startX + lineWidth, y);
        ctx.stroke();
      }
    }

    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
